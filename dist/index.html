        <h1>Nightroll: private payroll on Base</h1>
        <p><strong>Payroll for the night shift: USDC to hidden stealth addresses on Base.</strong> Nightroll needs JavaScript and an Ethereum browser wallet to run. Here is what it does.</p>
        <h2>The problem</h2>
        <p>Paying a team on-chain publishes everyone's wallet and salary next to the company treasury. Anyone can see who works there and what they earn, and follow their money afterwards.</p>
        <h2>How Nightroll works</h2>
        <ol>
          <li><strong>Get paid:</strong> each person generates an ERC-5564 stealth meta-address in the browser and shares it. Their keys never leave their device.</li>
          <li><strong>Pay:</strong> the employer uploads a CSV (<code>name,stealth_meta_address,amount</code>), reviews every payment and approves them in their wallet. Every row goes to a brand-new one-time address, with an on-chain announcement and an optional ETH top-up for gas.</li>
          <li><strong>Receive:</strong> the recipient scans announcements with their keys, sees the payments only they can match, and withdraws to any wallet.</li>
        </ol>
        <h2>What is private and what is not</h2>
        <p>Hidden: who gets paid. Public: amounts, timing and the treasury wallet. Next steps include standard-sized payment chunks, a shielded pool and gasless withdrawals.</p>
        <h2>Built to be safe to run</h2>
        <ul>
          <li>Strict CSV validation and a review of every payment before anything is sent.</li>
          <li>A resumed payroll never pays the same person twice: a local journal plus on-chain checks before any resend.</li>
          <li>Runs entirely in the browser on Base Sepolia, with a flag for Base mainnet. Receipts link to BaseScan.</li>
        </ul>
        <p>Source: <a href="https://github.com/HonAkorede/belroll1">github.com/HonAkorede/belroll1</a>. Machine-readable summary: <a href="./llms.txt">llms.txt</a>.</p>
